name: Compile resume artifacts

on:
  push:
    paths:
      - "**/*.tex"
      - "**/resume.json"
      - "llm-profile.json"
      - "scripts/generate_manifest.py"
      - "scripts/generate_profile.py"
      - "scripts/test_generate_manifest.py"
      - "scripts/test_generate_profile.py"
      - ".github/workflows/compile.yml"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect TeX sources to compile
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          list=".changed-tex"
          : > "$list"

          collect_all() {
            find . -name '*.tex' -not -path './.github/*' -not -path './.git/*' \
              | sed 's|^\./||' | sort
          }

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            collect_all > "$list"
            echo "has_tex=true" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            before="${{ github.event.before }}"
            sha="${{ github.sha }}"
            if [ -z "$before" ] || [[ "$before" =~ ^0+$ ]]; then
              collect_all > "$list"
              echo "has_tex=true" >> "$GITHUB_OUTPUT"
            else
              git diff --name-only "$before" "$sha" | grep -E '\.tex$' >> "$list" || true
              if git diff --name-only "$before" "$sha" | grep -E '\.tex$' >/dev/null; then
                echo "has_tex=true" >> "$GITHUB_OUTPUT"
              else
                echo "has_tex=false" >> "$GITHUB_OUTPUT"
              fi
              # Recompile everything when the compiler itself changes.
              if git diff --name-only "$before" "$sha" | grep -qxF '.github/workflows/compile.yml'; then
                collect_all > "$list"
              fi
            fi
          else
            echo "has_tex=false" >> "$GITHUB_OUTPUT"
          fi

          grep -E '\.tex$' "$list" | sort -u > "${list}.tmp" || true
          mv "${list}.tmp" "$list"

          if [ -s "$list" ]; then
            echo "needs_compile=true" >> "$GITHUB_OUTPUT"
            echo "files<<EOF" >> "$GITHUB_OUTPUT"
            cat "$list" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "needs_compile=false" >> "$GITHUB_OUTPUT"
            echo "files=" >> "$GITHUB_OUTPUT"
            rm -f "$list"
            echo "::notice::No TeX files to compile."
          fi

      # TeX Live 2025 + pdflatex, matching a current Overleaf compile (not latexonline.cc).
      - name: Compile changed TeX files
        if: steps.changes.outputs.needs_compile == 'true'
        uses: xu-cheng/texlive-action@v3
        with:
          texlive_version: "2025"
          run: |
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              echo "Compiling: $f"
              latexmk -cd -pdf -file-line-error -halt-on-error -interaction=nonstopmode "$f"
              latexmk -cd -c "$f"
              pdf="${f%.tex}.pdf"
              if [ ! -f "$pdf" ] || ! head -c 5 "$pdf" | grep -q '%PDF-'; then
                echo "::error::${f} did not produce a PDF"
                exit 1
              fi
              echo "::notice::Generated ${pdf}"
            done < .changed-tex
            rm -f .changed-tex

      - name: Generate candidate profile from changed resumes
        if: steps.changes.outputs.has_tex == 'true'
        env:
          PROFILE_LLM_API_KEY: ${{ secrets.PROFILE_LLM_API_KEY }}
          PROFILE_LLM_MODEL: ${{ vars.PROFILE_LLM_MODEL }}
          PROFILE_LLM_BASE_URL: ${{ vars.PROFILE_LLM_BASE_URL }}
        run: python scripts/generate_profile.py

      - name: Commit generated resume artifacts
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- '*.pdf' 'llm-profile.json')" ]; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ':(glob)**/*.pdf' 'llm-profile.json'
          git commit -m "chore: regenerate resume artifacts"
          git push origin "${{ github.ref_name }}"
          echo "::notice::Committed regenerated resume artifacts."

      - name: Test artifact generators
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Prepare validated Pages artifact
        run: |
          python scripts/generate_manifest.py \
            --site _site \
            --repository "${{ github.repository }}" \
            --revision "${{ github.sha }}" \
            --pages-base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          printf '# Resume Vault\n\nSee [manifest.json](./manifest.json) for the machine-readable catalog.\n' > _site/index.md
          find _site -maxdepth 3 -type f -print

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: compile
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
