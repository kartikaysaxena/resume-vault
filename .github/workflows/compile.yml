name: Compile resume artifacts

on:
  push:
    paths:
      - "**/*.tex"
      - "**/resume.json"
      - "llm-profile.json"
      - "scripts/generate_manifest.py"
      - "scripts/generate_profile.py"
      - "scripts/test_generate_manifest.py"
      - "scripts/test_generate_profile.py"
      - ".github/workflows/compile.yml"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed TeX sources
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          changed_tex=""
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            changed_tex=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -E '\.tex$' || true)
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            changed_tex=$(find . -name '*.tex' -not -path './.github/*' -not -path './.git/*' || true)
          fi
          {
            echo 'files<<EOF'
            echo "$changed_tex"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Compile changed TeX files
        env:
          CHANGED_TEX: ${{ steps.changes.outputs.files }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CHANGED_TEX" ]; then
            echo "::notice::No changed TeX files to compile."
            exit 0
          fi

          REF="${{ github.sha }}"
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            echo "Compiling: $f"
            raw_url="https://raw.githubusercontent.com/${{ github.repository }}/${REF}/${f}"
            outdir="$(dirname "$f")"
            outname="$(basename "${f%.tex}.pdf")"
            curl -fsSL --max-time 180 \
              "https://latexonline.cc/compile?url=${raw_url}&force=1" \
              -o "${outdir}/${outname}" \
            || { echo "::error::Failed to compile ${f} via HTTP API"; exit 1; }
            if ! file "${outdir}/${outname}" | grep -qi 'PDF document'; then
              echo "::error::${f} did not produce a PDF:"
              cat "${outdir}/${outname}"
              exit 1
            fi
            echo "::notice::Generated ${outdir}/${outname}"
          done <<< "$CHANGED_TEX"

      - name: Generate candidate profile from changed resumes
        if: steps.changes.outputs.files != ''
        env:
          PROFILE_LLM_API_KEY: ${{ secrets.PROFILE_LLM_API_KEY }}
          PROFILE_LLM_MODEL: ${{ vars.PROFILE_LLM_MODEL }}
          PROFILE_LLM_BASE_URL: ${{ vars.PROFILE_LLM_BASE_URL }}
        run: python scripts/generate_profile.py

      - name: Commit generated resume artifacts
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- '*.pdf' 'llm-profile.json')" ]; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ':(glob)**/*.pdf' 'llm-profile.json'
          git commit -m "chore: regenerate resume artifacts"
          git push origin "${{ github.ref_name }}"
          echo "::notice::Committed regenerated resume artifacts."

      - name: Test artifact generators
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Prepare validated Pages artifact
        run: |
          python scripts/generate_manifest.py \
            --site _site \
            --repository "${{ github.repository }}" \
            --revision "${{ github.sha }}" \
            --pages-base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          printf '# Resume Vault\n\nSee [manifest.json](./manifest.json) for the machine-readable catalog.\n' > _site/index.md
          find _site -maxdepth 3 -type f -print

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: compile
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
