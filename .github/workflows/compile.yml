name: Compile Resume PDFs

# Trigger when any .tex file changes in a role folder (or manual dispatch).
on:
  push:
    paths:
      - "**/*.tex"
  workflow_dispatch: {}

permissions:
  contents: write      # commit the compiled PDF back
  pages: write         # deploy to GitHub Pages
  id-token: write      # required for Pages deploy auth

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so we can diff which .tex changed

      # Compile via the latexonline.cc HTTP API (no local TeX install needed).
      # The API fetches the raw .tex from GitHub and returns the compiled PDF.
      - name: Compile changed .tex files via HTTP API
        shell: bash
        run: |
          set -euo pipefail
          changed_tex=""
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            changed_tex=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" \
              | grep -E '\.tex$' || true)
          fi
          if [ -z "$changed_tex" ]; then
            echo "No .tex changed in this event; scanning for role-folder .tex files..."
            changed_tex=$(find . -name '*.tex' -not -path './.github/*' -not -path './.git/*' || true)
          fi
          if [ -z "$changed_tex" ]; then
            echo "::notice::No .tex files found to compile."
            exit 0
          fi

          REF="${{ github.sha }}"
          for f in $changed_tex; do
            echo "Compiling: $f"
            raw_url="https://raw.githubusercontent.com/${{ github.repository }}/${REF}/${f}"
            outdir="$(dirname "$f")"
            outname="$(basename "${f%.tex}.pdf")"
            curl -fsSL --max-time 180 \
              "https://latexonline.cc/compile?url=${raw_url}&force=1" \
              -o "${outdir}/${outname}" \
            || { echo "::error::Failed to compile ${f} via HTTP API"; exit 1; }
            if ! file "${outdir}/${outname}" | grep -qi 'PDF document'; then
              echo "::error::${f} did not produce a PDF:"
              cat "${outdir}/${outname}"
              exit 1
            fi
            echo "::notice::Generated ${outdir}/${outname}"
          done

      - name: Commit compiled PDFs
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit (PDFs unchanged)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: recompile resume PDFs from .tex changes"
          git push origin "${{ github.ref_name }}"
          echo "::notice::Committed recompiled PDFs."

      # Publish every folder's PDF to GitHub Pages under a STATIC URL.
      # URL is derived from the folder + filename, so it stays constant across
      # every recompile of the same resume.
      - name: Prepare Pages artifact (static PDF URLs)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          # Copy each role folder's PDF + tex, preserving folder structure.
          for d in */; do
            d="${d%/}"
            # skip dot-dirs like .github
            [[ "$d" == .* ]] && continue
            for pdf in "$d"/*.pdf; do
              [ -e "$pdf" ] || continue
              mkdir -p "_site/$d"
              cp "$pdf" "_site/$d/"
              # also carry the .tex alongside for reference
              tex="${pdf%.pdf}.tex"
              [ -e "$tex" ] && cp "$tex" "_site/$d/" || true
            done
          done
          # A simple index page listing all available resumes
          {
            echo "# Resume Vault"
            echo
            echo "Stable URLs (same link every iteration):"
            echo
            for d in */; do
              d="${d%/}"
              [[ "$d" == .* ]] && continue
              for pdf in "$d"/*.pdf; do
                [ -e "$pdf" ] || continue
                echo "- [${d}/$(basename "$pdf")](/${d}/$(basename "$pdf"))"
              done
            done
          } > _site/index.md
          echo "::notice::Pages artifact prepared."
          ls -R _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: compile
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
