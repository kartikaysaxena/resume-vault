name: Compile Resume PDFs

# Rebuild PDFs when TeX changes and republish when catalog metadata changes.
on:
  push:
    paths:
      - "**/*.tex"
      - "**/resume.json"
      - "scripts/generate_manifest.py"
      - "scripts/test_generate_manifest.py"
      - ".github/workflows/compile.yml"
  workflow_dispatch: {}

permissions:
  contents: write      # commit the compiled PDF back
  pages: write         # deploy to GitHub Pages
  id-token: write      # required for Pages deploy auth

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so we can diff which .tex changed

      # Compile via the latexonline.cc HTTP API (no local TeX install needed).
      # The API fetches the raw .tex from GitHub and returns the compiled PDF.
      - name: Compile changed .tex files via HTTP API
        shell: bash
        run: |
          set -euo pipefail
          changed_tex=""
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            changed_tex=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" \
              | grep -E '\.tex$' || true)
          fi
          if [ -z "$changed_tex" ] && [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "Manual run; scanning for role-folder .tex files..."
            changed_tex=$(find . -name '*.tex' -not -path './.github/*' -not -path './.git/*' || true)
          fi
          if [ -z "$changed_tex" ]; then
            echo "::notice::No changed .tex files to compile."
            exit 0
          fi

          REF="${{ github.sha }}"
          for f in $changed_tex; do
            echo "Compiling: $f"
            raw_url="https://raw.githubusercontent.com/${{ github.repository }}/${REF}/${f}"
            outdir="$(dirname "$f")"
            outname="$(basename "${f%.tex}.pdf")"
            curl -fsSL --max-time 180 \
              "https://latexonline.cc/compile?url=${raw_url}&force=1" \
              -o "${outdir}/${outname}" \
            || { echo "::error::Failed to compile ${f} via HTTP API"; exit 1; }
            if ! file "${outdir}/${outname}" | grep -qi 'PDF document'; then
              echo "::error::${f} did not produce a PDF:"
              cat "${outdir}/${outname}"
              exit 1
            fi
            echo "::notice::Generated ${outdir}/${outname}"
          done

      - name: Commit compiled PDFs
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- '*.pdf')" ]; then
            echo "No changes to commit (PDFs unchanged)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ':(glob)**/*.pdf'
          git commit -m "chore: recompile resume PDFs from .tex changes"
          git push origin "${{ github.ref_name }}"
          echo "::notice::Committed recompiled PDFs."

      - name: Test manifest generator
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Prepare validated Pages artifact
        run: |
          python scripts/generate_manifest.py \
            --site _site \
            --repository "${{ github.repository }}" \
            --revision "${{ github.sha }}" \
            --pages-base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          printf '# Resume Vault\n\nSee [manifest.json](./manifest.json) for the machine-readable catalog.\n' > _site/index.md
          find _site -maxdepth 3 -type f -print

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: compile
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
